name: Deploy

# main 에 push 하면 검사 통과 후 자동 배포 (저장소 변수 AUTO_DEPLOY=true 일 때만).
# 수동 실행(Actions → Deploy → Run workflow)은 언제나 가능.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나씩. 진행 중인 배포는 끊지 않고, 대기 중인 것은 최신 커밋 하나만 남는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: 검사 (lint·타입·테스트·빌드)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
      - name: 릴리스 묶음
        id: pkg
        run: |
          ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          bash deploy/build-release.sh "$ID"
          echo "file=release-${ID}.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ steps.pkg.outputs.file }}
          retention-days: 7
    outputs:
      file: ${{ steps.pkg.outputs.file }}

  deploy:
    name: 서버 배포
    needs: check
    # 수동 실행은 항상, push 는 AUTO_DEPLOY=true 일 때만
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: 배포 설정 확인
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::production environment secrets 가 없습니다:$missing (docs/DEPLOY.md 5단계)"
            exit 1
          fi

      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # 서버 호스트 키 고정 (중간자 공격 방지)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: 업로드·활성화 (마이그레이션 → 전환 → 상태 확인 → 실패 시 되돌리기)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          FILE: ${{ needs.check.outputs.file }}
        run: |
          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          scp $OPTS "$FILE" "deploy@${DEPLOY_HOST}:/opt/partfinder/incoming/$FILE"
          ssh $OPTS "deploy@${DEPLOY_HOST}" "sudo /opt/partfinder/bin/activate-release /opt/partfinder/incoming/$FILE"

      - name: 외부에서 상태 확인
        if: vars.SITE_URL != ''
        run: |
          for i in $(seq 1 10); do
            curl -fsS -m 10 "${{ vars.SITE_URL }}/api/health" && exit 0
            sleep 3
          done
          echo "::error::${{ vars.SITE_URL }}/api/health 응답 없음 (서버 안에서는 정상이었음 — DNS·HTTPS·방화벽 확인)"
          exit 1

      - name: 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
